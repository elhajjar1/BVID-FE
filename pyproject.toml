[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bvidfe"
version = "0.2.0"
description = "Barely Visible Impact Damage residual-strength analysis for composite laminates"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Rani Elhajjar"}]
keywords = [
    "composites",
    "laminate",
    "impact damage",
    "BVID",
    "compression after impact",
    "residual strength",
    "delamination",
    "finite element",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# plotly stays a core dependency: bvidfe.viz.plotly_3d imports it.
# Streamlit is only needed by the web app (app.py, in the repository).
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "shapely>=2.0,<3",
    "pandas>=2.0,<3",
    "plotly>=5.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.51,<2"]
# streamlit is in dev so CI runs the app tests (tests/test_streamlit_app.py).
dev = [
    "pytest>=7,<10",
    "pytest-cov>=4,<8",
    "coverage>=7.10",
    "ruff>=0.5,<1",
    "black>=24,<27",
    "pre-commit>=3,<5",
    "streamlit>=1.51,<2",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/elhajjar1/BVID-FE"
Documentation = "https://elhajjar1.github.io/BVID-FE/"
Repository = "https://github.com/elhajjar1/BVID-FE"
Issues = "https://github.com/elhajjar1/BVID-FE/issues"
Changelog = "https://github.com/elhajjar1/BVID-FE/blob/main/CHANGELOG.md"

[project.scripts]
bvidfe = "bvidfe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bvidfe = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set rather than inheriting ruff's defaults: ruff 0.16 widened
# its default selection (UP, I, C4, RUF, PLR, ...), which turned CI red on
# 164 pre-existing findings. These are the pre-0.16 defaults; widen the list
# deliberately in its own PR.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# pytest-cov 7 no longer measures subprocesses; the CLI tests run
# `python -m bvidfe.cli` in a subprocess.
patch = ["subprocess"]
