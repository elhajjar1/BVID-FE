name: audit
# Known-CVE scan of the installed dependency set (runtime + dev, which
# includes streamlit, so it covers requirements.txt too). Runs on PRs and
# pushes to main, and weekly so advisories published against unchanged
# pins still surface.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Upgrade the installer tooling first: the runner's own pip and
      # setuptools are not BVID-FE dependencies but are in the audited env.
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      # bvidfe itself is skipped (editable, not a dependency); not --strict,
      # since --strict fails on that skip. Any vulnerability still fails.
      - name: Audit dependencies for known CVEs
        run: pip-audit --desc --skip-editable
