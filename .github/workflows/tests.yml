name: tests
# Branch commits run once, as a pull_request run; main runs on push.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same PR (or to main) cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Lint, type check, schema check and the coverage artifact are
      # platform-independent, so they run in this one cell only.
      LINT_CELL: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        if: env.LINT_CELL == 'true'
        run: ruff check src tests
      - name: black
        if: env.LINT_CELL == 'true'
        run: black --check src tests
      - name: mypy
        if: env.LINT_CELL == 'true'
        # Checks the files listed under [tool.mypy] in pyproject.toml.
        run: mypy
      - name: "JSON schemas match the dataclasses"
        if: env.LINT_CELL == 'true'
        # docs/schemas/*.json are generated; regenerate them with
        # `python scripts/generate_schemas.py` in the commit that changes a field.
        run: python scripts/generate_schemas.py --check
      # Coverage gate. Measured on main at 95.7% (2026-11, 128 of 2952
      # statements missed); the floor stays at 90% because 95% would leave
      # under one point of headroom on every cell. Raise it to 95 once
      # coverage holds at 96% or more.
      - run: pytest -v --cov=bvidfe --cov-report=xml --cov-report=term --cov-fail-under=90
      - name: Upload coverage report
        if: always() && env.LINT_CELL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  validation:
    # Independent of the test matrix, so it runs alongside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: "Validation: empirical tier (hard gate)"
        run: python validation/validate_bvid_public.py --gate
      - name: "Validation: semi_analytical tier on measured data (hard gate)"
        # Measured datasets only (every dataset JSON with "kind": "measured"):
        # synthetic_selfcheck is generated from the empirical tier, so scoring
        # another tier on it measures the gap between the tiers, not accuracy.
        run: python validation/validate_bvid_public.py --gate --tier=semi_analytical --measured
      - name: "Slow tests: fe3d h-refinement on the 150 x 100 mm reference panel"
        # The `slow` marker is deselected by default (pyproject addopts), so
        # the 9-cell matrix skips it; the fe3d mesh is platform-independent,
        # so one run here covers it. About 2.5 min.
        run: pytest -m slow -v
      - name: "Validation: fe3d tier (smoke run; first 3 cases)"
        # Exercises the fe3d path end to end and prints its errors. Not a
        # gate: synthetic_selfcheck is empirical-tier output, so comparing
        # fe3d to it measures the difference between the tiers, not fe3d's
        # accuracy. About 30 s per 16-ply synthetic case on a GitHub runner;
        # a 24-ply NCAMP coupon takes about 40 s, so measured data is not run.
        run: python validation/validate_bvid_public.py --tier=fe3d --dataset=synthetic_selfcheck --max-cases=3
        continue-on-error: true
