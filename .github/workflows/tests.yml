name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: black --check src tests
      # Coverage gate. Measured baseline on main was ~93% (2026-05); the
      # floor is set to 90% (current value rounded DOWN to the nearest 5%)
      # so routine refactors don't break CI while still catching meaningful
      # regressions. Raise this floor in a follow-up PR once coverage is
      # consistently higher.
      - run: pytest -v --cov=bvidfe --cov-report=xml --cov-report=term --cov-fail-under=90
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: "JSON schemas match the dataclasses"
        # docs/schemas/*.json are generated; regenerate them with
        # `python scripts/generate_schemas.py` in the commit that changes a field.
        run: python scripts/generate_schemas.py --check
      - name: "Validation: empirical tier (hard gate)"
        run: python validation/validate_bvid_public.py --gate
      - name: "Validation: semi_analytical tier on measured data (hard gate)"
        # Measured datasets only: synthetic_selfcheck is generated from the
        # empirical tier, so scoring another tier on it measures the gap
        # between the tiers, not accuracy.
        run: python validation/validate_bvid_public.py --gate --tier=semi_analytical --dataset ncamp_as4_8552_cai lovejoy_scotti_im7_8552_cai hasebe_t800s_3900_2b_cai korbelin_m21_t800s_tai
      - name: "Validation: fe3d tier (smoke run; first 3 cases)"
        # Exercises the fe3d path end to end and prints its errors. Not a
        # gate: synthetic_selfcheck is empirical-tier output, so comparing
        # fe3d to it measures the difference between the tiers, not fe3d's
        # accuracy. About 30 s per 16-ply synthetic case on a GitHub runner;
        # a 24-ply NCAMP coupon takes about 40 s, so measured data is not run.
        run: python validation/validate_bvid_public.py --tier=fe3d --dataset=synthetic_selfcheck --max-cases=3
        continue-on-error: true
